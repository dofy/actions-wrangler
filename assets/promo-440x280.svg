<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1e24"/>
      <stop offset="100%" style="stop-color:#24292f"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  
  <!-- Icon (centered, scaled down) -->
  <g transform="translate(50, 35) scale(0.75)">
    <!-- Capital A -->
    <path fill="#e6edf3" d="M64 8L18 120h20l10-24h60l10 24h20L64 8zm0 32l20 48H44l20-48z"/>

    <!-- Lasso rope loop -->
    <ellipse cx="64" cy="56" rx="54" ry="38" fill="none" stroke="#f0883e" stroke-width="7" stroke-linecap="round"/>

    <!-- Lasso rope tail/handle -->
    <path fill="none" stroke="#f0883e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M114 80 Q 128 95, 120 110 Q 112 122, 96 118"/>

    <!-- Rope texture -->
    <ellipse cx="64" cy="56" rx="54" ry="38" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 10" stroke-linecap="round"/>
  </g>

  <!-- Extension name -->
  <text x="50" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#e6edf3" text-anchor="start">Actions Wrangler</text>

  <!-- Tagline -->
  <text x="50" y="235" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e" text-anchor="start">Pin unlimited GitHub Actions workflows</text>
</svg>
